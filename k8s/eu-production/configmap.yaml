apiVersion: v1
kind: ConfigMap
metadata:
  name: almona-config
  namespace: almona-industrial-eu
data:
  ENVIRONMENT: "eu-production"
  REGION: "eu-west-1"
  LOG_LEVEL: "INFO"
  ENABLE_TRACING: "true"
  ENABLE_METRICS: "true"
  PROMETHEUS_PORT: "8001"
  JAEGER_ENDPOINT: "jaeger-collector:14268"
  SUPABASE_MAX_CONNECTIONS: "20"
  SUPABASE_QUERY_TIMEOUT: "30.0"
  SUPABASE_HEALTH_CHECK_INTERVAL: "60.0"
  SUPABASE_SLOW_QUERY_THRESHOLD: "1000.0"
  SUPABASE_MAX_RETRIES: "3"
  # GDPR Compliance Settings
  GDPR_COMPLIANCE: "enabled"
  DATA_RESIDENCY_REGION: "eu-west-1"
  COOKIE_CONSENT_REQUIRED: "true"
  DATA_RETENTION_DAYS: "730"
  PRIVACY_BY_DEFAULT: "true"
  RIGHT_TO_ERASURE_ENABLED: "true"
  DATA_PORTABILITY_ENABLED: "true"
  # Multi-language Support
  SUPPORTED_LANGUAGES: "en,fr,de,ar,tr"
  DEFAULT_LANGUAGE: "en"
  AUTO_LANGUAGE_DETECTION: "true"
  # Enhanced Security
  SECURITY_HEADERS_ENABLED: "true"
  CONTENT_SECURITY_POLICY: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
  X_FRAME_OPTIONS: "DENY"
  X_CONTENT_TYPE_OPTIONS: "nosniff"
  REFERRER_POLICY: "strict-origin-when-cross-origin"
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_ANONYMOUS_PER_MINUTE: "30"
  RATE_LIMIT_ANONYMOUS_PER_HOUR: "500"
  RATE_LIMIT_ANONYMOUS_BURST: "5"
  RATE_LIMIT_AUTHENTICATED_PER_MINUTE: "100"
  RATE_LIMIT_AUTHENTICATED_PER_HOUR: "2000"
  RATE_LIMIT_AUTHENTICATED_BURST: "15"
  RATE_LIMIT_PREMIUM_PER_MINUTE: "200"
  RATE_LIMIT_PREMIUM_PER_HOUR: "5000"
  RATE_LIMIT_PREMIUM_BURST: "30"
  RATE_LIMIT_ADMIN_PER_MINUTE: "500"
  RATE_LIMIT_ADMIN_PER_HOUR: "10000"
  RATE_LIMIT_ADMIN_BURST: "50"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gdpr-compliance-config
  namespace: almona-industrial-eu
data:
  gdpr_settings.json: |
    {
      "complianceLevel": "strict",
      "dataProcessingLawfulBasis": [
        "consent",
        "legitimate_interest",
        "contract"
      ],
      "cookieCategories": {
        "necessary": {
          "required": true,
          "description": "Essential cookies for website functionality"
        },
        "analytics": {
          "required": false,
          "description": "Cookies for website analytics and performance"
        },
        "marketing": {
          "required": false,
          "description": "Cookies for personalized marketing"
        }
      },
      "retentionPolicies": {
        "userProfiles": "2 years",
        "sessionData": "30 days",
        "analyticsData": "14 months",
        "marketingData": "13 months"
      }
    }