apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: almona-api-ingress
  namespace: almona-industrial-eu
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # GDPR and Security Headers
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header GDPR-Compliance "enabled" always;
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # GDPR Cookie compliance
      if ($cookie_gdpr_consent != "accepted") {
        add_header Set-Cookie "gdpr_notice=required; Path=/; HttpOnly; Secure; SameSite=Strict" always;
      }
spec:
  tls:
  - hosts:
    - eu.almona.com
    - europe.almona.com
    - almona.eu
    secretName: almona-eu-api-tls
  rules:
  - host: eu.almona.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: almona-api-service
            port:
              number: 80
  - host: europe.almona.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: almona-api-service
            port:
              number: 80
  - host: almona.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: almona-api-service
            port:
              number: 80