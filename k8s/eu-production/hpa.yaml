apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: almona-api-hpa-eu
  namespace: almona-industrial-eu
  labels:
    app: almona-api
    region: eu-west-1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: almona-api-eu
  minReplicas: 5  # Higher minimum for EU market
  maxReplicas: 20  # Higher maximum for peak loads
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60  # Lower threshold for better performance
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  - type: Pods
    pods:
      metric:
        name: requests_per_second
      target:
        type: AverageValue
        averageValue: "100"  # Scale based on RPS
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60  # 1 minute for faster response
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max