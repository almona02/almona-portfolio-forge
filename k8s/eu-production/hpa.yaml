apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: almona-api-hpa
  namespace: almona-industrial-eu
  labels:
    region: eu-west-1
    compliance: gdpr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: almona-api
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 15
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 45
      policies:
      - type: Percent
        value: 75
        periodSeconds: 45
      - type: Pods
        value: 3
        periodSeconds: 45
      selectPolicy: Max