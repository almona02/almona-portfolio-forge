    <!-- Google Analytics - Deferred until after page load for better performance -->
    <script>
      // Check if analytics should be disabled (respect user privacy)
      const analyticsDisabled =
        localStorage.getItem("disable-analytics") === "true" ||
        navigator.doNotTrack === "1" ||
        window.location.hostname === "localhost";

      // Initialize dataLayer and gtag function immediately (for code that calls it)
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        if (window.dataLayer) {
          window.dataLayer.push(arguments);
        }
      }
      window.gtag = gtag;

      if (!analyticsDisabled) {
        try {
          // TBT OPTIMIZATION: Load GTM after 4 seconds OR on first user interaction
          // This reduces initial JavaScript execution time by ~300-400ms
          const loadGTM = function () {
            // Check if GTM script is already present
            if (document.querySelector('script[src*="googletagmanager"]'))
              return;

            var script = document.createElement("script");
            script.async = true;
            script.src =
              "https://www.googletagmanager.com/gtag/js?id=G-321C22X7E3";

            // Add error handling for blocking extensions
            script.onerror = function (e) {
              // Silently fail - analytics blocked by privacy extensions is expected
              console.debug(
                "Analytics blocked by client - this is expected behavior.",
              );
              // Ensure gtag is still a function to prevent app crashes
              window.gtag = function () {};
            };

            document.head.appendChild(script);

            gtag("js", new Date());
            gtag("config", "G-321C22X7E3", {
              // Disable advertising features for privacy
              allow_ad_features: false,
              allow_ad_personalization_signals: false,
              cookie_flags: "SameSite=None;Secure",
            });
          };

          // Load after 4 seconds OR on first user interaction (scroll, click, keydown)
          const gtmTimeout = setTimeout(loadGTM, 4000);

          const interactionListener = function () {
            clearTimeout(gtmTimeout);
            loadGTM();
            window.removeEventListener("scroll", interactionListener);
            window.removeEventListener("click", interactionListener);
            window.removeEventListener("keydown", interactionListener);
            window.removeEventListener("touchstart", interactionListener);
          };

          window.addEventListener("scroll", interactionListener, {
            once: true,
            passive: true,
          });
          window.addEventListener("click", interactionListener, { once: true });
          window.addEventListener("keydown", interactionListener, {
            once: true,
          });
          window.addEventListener("touchstart", interactionListener, {
            once: true,
            passive: true,
          });
        } catch (error) {
          console.warn("Google Analytics initialization failed:", error);
          // Fallback to no-op
          window.gtag = function () {};
        }
      } else {
        // Provide a no-op gtag function for code that expects it
        window.gtag = function () {
          /* Analytics disabled */
        };
      }
    </script>

    <!-- PWA: VitePWA only - no custom service-worker.js (was causing double SW / stale cache) -->
    <script>
      // Prevent service worker registration errors in preview mode
      if (
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
      ) {
        const originalRegister = navigator.serviceWorker?.register;
        if (originalRegister) {
          navigator.serviceWorker.register = function (scriptURL, options) {
            // Prevent registration of manifest.webmanifest as a service worker
            if (
              typeof scriptURL === "string" &&
              scriptURL.includes("manifest.webmanifest")
            ) {
              console.warn(
                "[SW] Skipping manifest.webmanifest registration in preview mode",
              );
              return Promise.reject(
                new Error(
                  "Service worker registration disabled in preview mode",
                ),
              );
            }
            // Allow other registrations to proceed
            return originalRegister.call(this, scriptURL, options);
          };
        }
        // Suppress unhandled promise rejections from service worker registration
        window.addEventListener("unhandledrejection", function (event) {
          if (
            event.reason &&
            (event.reason.message?.includes("ServiceWorker") ||
              event.reason.message?.includes("manifest.webmanifest") ||
              event.reason.message?.includes("unsupported MIME type"))
          ) {
            console.warn(
              "[SW] Suppressed service worker error in preview mode:",
              event.reason.message,
            );
            event.preventDefault();
          }
        });
      }
