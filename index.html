        }

    <!-- PHASE 1.6: Service Worker Registration - Enhanced for Egypt workflow -->
    <!-- FIX: Only register in production to avoid dev mode conflicts -->
    <script>
      // Only register custom service worker in production
      // In development, VitePWA is disabled and we don't want SW conflicts
      const isProduction = window.location.hostname !== 'localhost' && 
                          window.location.hostname !== '127.0.0.1' &&
                          !window.location.hostname.includes('localhost');
      
      if ('serviceWorker' in navigator && isProduction) {
        window.addEventListener('load', () => {
          // Register custom service worker for Egypt workflow optimization
          // Note: In production, VitePWA handles /sw.js, our custom worker provides additional caching
          navigator.serviceWorker.register('/service-worker.js', {
            scope: '/'
          }).then((registration) => {
            console.log('[Almona Egypt SW] Custom service worker registered:', registration.scope);
            
            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                console.log('[Almona Egypt SW] Update found');
                
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      // New update available
                      console.log('[Almona Egypt SW] Update ready - reload to activate');
                    }
                  }
                });
              }
            });
          }).catch((error) => {
            console.log('[Almona Egypt SW] Registration failed (non-critical):', error);
            // Non-critical - app works without custom service worker
          });
          
          // Periodic updates (every 1 hour)
          setInterval(() => {
            navigator.serviceWorker.ready.then((registration) => {
              registration.update();
            }).catch(() => {
              // Ignore update errors
            });
          }, 3600000); // 1 hour
        });
      } else {
        // In development, unregister any existing service workers to prevent conflicts
        // Check if we're in dev mode by checking hostname
        const isDev = window.location.hostname === 'localhost' || 
                     window.location.hostname === '127.0.0.1' ||
                     window.location.hostname.includes('localhost');
        if (isDev) {
          window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            registrations.forEach(registration => {
              // Only unregister our custom service worker, not VitePWA's
              if (registration.scope.includes('service-worker.js')) {
                registration.unregister().then(() => {
                  console.log('[Almona Egypt SW] Unregistered in dev mode to prevent conflicts');
                });
              }
            });
          });
        });
        }
      }
      
      // Prevent service worker registration errors in preview mode
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        const originalRegister = navigator.serviceWorker?.register;
        if (originalRegister) {
          navigator.serviceWorker.register = function(scriptURL, options) {
            // Prevent registration of manifest.webmanifest as a service worker
            if (typeof scriptURL === 'string' && scriptURL.includes('manifest.webmanifest')) {
              console.warn('[SW] Skipping manifest.webmanifest registration in preview mode');
              return Promise.reject(new Error('Service worker registration disabled in preview mode'));
            }
            // Allow other registrations to proceed
            return originalRegister.call(this, scriptURL, options);
          };
        }
        // Suppress unhandled promise rejections from service worker registration
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (
            event.reason.message?.includes('ServiceWorker') ||
            event.reason.message?.includes('manifest.webmanifest') ||
            event.reason.message?.includes('unsupported MIME type')
          )) {
            console.warn('[SW] Suppressed service worker error in preview mode:', event.reason.message);
            event.preventDefault();
          }
        });
      }
    </script>
