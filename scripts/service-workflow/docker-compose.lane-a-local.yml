# Isolated Lane A local Postgres for disposable apply/battery (NOT staging/production).
# Requires Docker Desktop engine. If `docker info` fails, use Path B in SPARK_LANE_A_LOCAL_BROWSER.md.
services:
  lane-a-pg:
    image: postgres:17
    container_name: almona-lane-a-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lane_a_local_only
      POSTGRES_DB: routines_lane_a
    ports:
      - "55458:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routines_lane_a"]
      interval: 3s
      timeout: 3s
      retries: 20
