# Isolated Lane C checklist browser stack — Auth/API/Postgres on loopback only.
# Separate from almona-lane-a-local, the default local project, and FR-1 recovery.
# Never point at staging or production.
# Bound to correction e27f21a530fe0eb122ab7886eb8a7854f066a896
# (migration 20261118140000). Migrations are applied by the bootstrap script.

project_id = "almona-lane-c-checklist-local"

[api]
enabled = true
port = 54431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54432
shadow_port = 54430
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54439

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

# Host ports are published on loopback by the CLI. Do not enable CIDR restrictions
# here — they can break Docker-internal Kong→Postgres connectivity.
[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54433
api_url = "http://127.0.0.1"
openai_api_key = ""

[local_smtp]
enabled = true
port = 54434

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3012"
additional_redirect_urls = ["http://127.0.0.1:3012", "http://localhost:3012"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 100
sms_sent = 0
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 100
token_verifications = 100
web3 = 0

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 54437

[experimental]
orioledb_version = ""
s3_host = ""
s3_region = ""
s3_access_key = ""
s3_secret_key = ""
