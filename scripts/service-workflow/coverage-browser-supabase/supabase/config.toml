# Isolated coverage UI browser stack — Auth/API/Postgres on loopback only.
# Separate from Lane C checklist stack, lane-a-local, and FR-1 recovery.
# Never point at staging or production.
# Environment-only: distinct from the F-COV-CAP-1 product correction.

project_id = "almona-coverage-browser-local"

[api]
enabled = true
port = 54441
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54442
shadow_port = 54440
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54449

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54443
api_url = "http://127.0.0.1"
openai_api_key = ""

[local_smtp]
enabled = true
port = 54444

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3013"
additional_redirect_urls = ["http://127.0.0.1:3013", "http://localhost:3013"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 100
sms_sent = 0
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 100
token_verifications = 100
web3 = 0

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 54447

[experimental]
orioledb_version = ""
s3_host = ""
s3_region = ""
s3_access_key = ""
s3_secret_key = ""
