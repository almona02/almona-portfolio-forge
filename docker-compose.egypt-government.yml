services:
  # The Platform Core (Backend)
  backend:
    build: ./python_backend
    environment:
      - DEPLOYMENT_MODE=SOVEREIGN
      - DATA_RESIDENCY=EGYPT
      - VAT_COMPLIANCE=TRUE
      - DATABASE_URL=postgresql://admin_gov:secure_db_password_123@db:5432/almona_gov
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      # Sovereign mode uses local PostgreSQL instead of Supabase
      - SUPABASE_URL=http://localhost:8000
      - SUPABASE_SERVICE_KEY=sovereign-mode-local-db
      - SKIP_SUPABASE_INIT=true
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    secrets:
      - db_password

  # Frontend
  frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Sovereign Database
  db:
    image: postgres:15-alpine
    volumes:
      - ./gov-data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=almona_gov
      - POSTGRES_USER=admin_gov
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password

  # Local Object Storage
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./gov-data/storage:/data
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_password
    secrets:
      - minio_password

  # Local Redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

secrets:
  db_password:
    file: ./secrets/db_password.txt
  minio_password:
    file: ./secrets/minio_password.txt
