name: Vercel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (local verification)
        run: npm run build

      - name: Verify Vercel secrets presence
        run: |
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -n "${!var}" ]; then echo "$var=SET"; else echo "$var=MISSING"; fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          # IMPORTANT: Do NOT paste raw tokens or IDs here. Store them in repository Secrets
          # Settings > Secrets and variables > Actions:
          #   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-deployment: true
          github-comment: true
        env:
          # Some tools still look for env var VERCEL_TOKEN
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Output deployment url
        run: echo "Deployment complete."
