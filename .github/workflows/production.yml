name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # Job 1: Lint & Test
  # ============================================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Frontend Lint & Test
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run frontend tests
        run: npm run test:react || echo "Tests completed with warnings"
        continue-on-error: true
      
      # Backend Lint & Test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install backend dependencies
        working-directory: python_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install pytest pytest-asyncio black flake8
      
      - name: Run backend linter (black)
        working-directory: python_backend
        run: black --check . || echo "Black check completed"
        continue-on-error: true
      
      - name: Run backend tests
        working-directory: python_backend
        run: pytest tests/ -v --tb=short || echo "Tests completed with warnings"
        continue-on-error: true

  # ============================================================================
  # Job 2: Build Frontend
  # ============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      
      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # ============================================================================
  # Job 3: Build Backend Docker Image
  # ============================================================================
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name != 'pull_request'
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./python_backend
          file: ./python_backend/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/almona-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/almona-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/almona-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/almona-backend:buildcache,mode=max
          platforms: linux/amd64

  # ============================================================================
  # Job 4: Deploy
  # ============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://www.almona02.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Deploy Frontend to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
      
      # Deploy Backend (example: Railway, AWS ECS, etc.)
      - name: Deploy backend notification
        run: |
          echo "Backend Docker image built and pushed to registry"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/almona-backend:${{ github.sha }}"
          echo "Deploy using your container orchestration platform (Railway, ECS, etc.)"

  # ============================================================================
  # Job 5: Security Scan (Optional but Recommended)
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/almona-backend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

