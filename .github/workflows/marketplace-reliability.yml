name: Marketplace reliability
on:
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'scripts/*marketplace*'
      - 'scripts/*release-assets*'
      - 'tests/e2e/marketplace/**'
      - 'tests/marketplace-events.test.ts'
      - 'playwright.marketplace.config.ts'
      - 'supabase/migrations/*marketplace*'
      - 'package*.json'
      - '.github/workflows/marketplace-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:marketplace
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://marketplace-test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-public-key
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.marketplace.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: marketplace-browser-failures
          path: test-results/marketplace
          retention-days: 3
