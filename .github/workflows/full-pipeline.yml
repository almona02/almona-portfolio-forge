name: Full Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_ENV: production
  PYTHON_VERSION: '3.11'
  CACHE_VERSION: v1

jobs:
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps (include devDependencies)
        run: npm ci --no-audit --no-fund
        env:
          NPM_CONFIG_PRODUCTION: "false"
      - name: Optimize Images (WebP)
        run: |
          if command -v cwebp &> /dev/null; then
            bash ./scripts/optimize-images.sh || echo "WebP conversion skipped (tools not available)"
          else
            sudo apt-get update && sudo apt-get install -y webp
            bash ./scripts/optimize-images.sh || echo "WebP conversion skipped"
          fi
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npm run type-check
      - name: Unit Tests (vitest)
        run: npm run test -- --run
      - name: Build
        run: npm run build
      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error

  backend:
    name: Backend Tests & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend deps
        working-directory: python_backend
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --prefer-binary -r requirements-ci.txt
      - name: Backend Tests
        working-directory: python_backend
        env:
          PYTHONPATH: ${{ github.workspace }}/python_backend
        run: pytest -q
      - name: Bandit Scan
        working-directory: python_backend
        run: bandit -r . -q || true
      - name: Safety Vulnerability Check
        working-directory: python_backend
        run: safety check -r requirements.txt || true

  docker-image:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker image prune -af || true
      - name: Build Image
        run: docker build --pull --no-cache -t almona-ai-service -f python_backend/Dockerfile.gpu ./python_backend
      - name: Trivy Image Scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'almona-ai-service'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
      - name: Trivy FS Fallback
        if: steps.trivy.outcome == 'failure'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'python_backend'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
      - name: Export SBOM (Syft)
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: 'almona-ai-service'
          format: 'spdx-json'
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: sbom.spdx.json
          if-no-files-found: ignore

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker-image]
    steps:
      - name: Report
        run: echo "Frontend, Backend, and Docker stages completed."
