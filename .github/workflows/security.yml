name: Security Pipeline
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Python Security Scan
        run: |
          pip install pip-audit
          pip-audit --disable-pip --no-deps -r python_backend/requirements.txt --format json --output pip-audit-report.json
          
      - name: NPM Security Scan
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm audit --audit-level=high --json > ../npm-audit-report.json
          else
            echo "frontend directory not found; skipping npm audit."
            echo "{}" > npm-audit-report.json
          fi
          
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            npm-audit-report.json
          
  code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python
          
      - name: Check for MLflow regressions (imports only)
        run: |
          # Flag only real imports of mlflow (not comments/tests/docs)
          if rg --no-heading --glob '*.py' --pcre2 '^\s*(from|import)\s+mlflow' python_backend; then
            echo "::error::MLflow import found in codebase!"
            exit 1
          else
            echo "No MLflow imports found."
          fi
          
  security-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test Security Headers
        run: |
          # Replace with your domain
          curl -s -I https://staging.your-domain.com | grep -E "(X-Content-Type-Options|X-Frame-Options|Content-Security-Policy)" || echo "Headers check failed or domain not reachable"

