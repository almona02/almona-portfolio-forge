name: CI/CD Pipeline

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: '20'
            cache: 'npm'
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint

  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space (pre-build)
        run: |
          echo "Initial disk usage:" && df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          docker image prune -af || true
          echo "Post-clean disk usage:" && df -h /

      - name: Build Optimized Production Image
        run: |
          docker build --pull -t almona-ai-service:prod -f python_backend/Dockerfile.prod python_backend
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: (Optional) Build GPU Image (skip if not needed)
        if: false  # enable by setting to true when GPU scan required
        run: |
          docker build --pull -t almona-ai-service:gpu -f python_backend/Dockerfile.gpu python_backend
      - name: Run Trivy scan (prod image)
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'almona-ai-service:prod'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Fallback Trivy filesystem scan if image scan failed (space issues)
        if: steps.trivy-image.outcome == 'failure'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Prune Docker artifacts (post-scan)
        run: |
          docker image prune -af || true
          docker builder prune -af || true
          echo "Final disk usage:" && df -h /
      - name: Note
        run: echo "Skipped contract/chaos tests (files removed)"
