# Measured pooled optimize (Vitest): 10 positions / 18 units / >100 cuts.
# Classification remains estimate_only — not manufacturing-qualified live acceptance.
name: Fabricator measured pooled E2E

on:
  pull_request:
    paths:
      - "src/lib/fabricator/__tests__/manufacturingChain.caluminiumPs.e2e.test.ts"
      - "src/lib/fabricator/production/ProjectOptimizationEstimate.ts"
      - "src/lib/fabricator/bom/**"
      - "src/data/profileSystems/egyptian/caluminium/**"
      - ".github/workflows/fabricator-measured-pooled-e2e.yml"
  workflow_dispatch:

jobs:
  measured-pooled-optimize:
    name: 10/18/>100-cut estimate optimize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run measured pooled Vitest + write metrics
        env:
          MFG_E2E_METRICS_PATH: ${{ github.workspace }}/e2e-1018-metrics.json
        run: |
          npm run test -- --run src/lib/fabricator/__tests__/manufacturingChain.caluminiumPs.e2e.test.ts
          test -f e2e-1018-metrics.json
          python3 - <<'PY'
          import json
          m=json.load(open('e2e-1018-metrics.json'))
          assert m['classification']=='estimate_only'
          assert m['manufacturingEligible'] is False
          assert m['positionsResolved']==10
          assert m['units']==18
          assert m['placedCuts']>100
          assert m['unplacedCuts']==0
          assert abs(m['areaM2']-30.24)<1e-9
          print(json.dumps(m, indent=2))
          PY

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-1018-metrics
          path: e2e-1018-metrics.json
          if-no-files-found: error
