name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Mondays to monitor performance
    - cron: "0 0 * * 1"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          # Kill any existing process on ports 4173 and 4174
          lsof -ti:4173 | xargs kill -9 2>/dev/null || true
          lsof -ti:4174 | xargs kill -9 2>/dev/null || true
          # Start preview server in background
          npm run preview > /tmp/preview-server.log 2>&1 &
          PREVIEW_PID=$!
          echo "Preview server PID: $PREVIEW_PID"
          
          # Wait for server to be ready - check both ports
          echo "Waiting for server to start..."
          SERVER_PORT=""
          for i in {1..60}; do
            if curl -f http://localhost:4173/ > /dev/null 2>&1; then
              SERVER_PORT="4173"
              echo "Server is ready on port 4173!"
              break
            elif curl -f http://localhost:4174/ > /dev/null 2>&1; then
              SERVER_PORT="4174"
              echo "Server is ready on port 4174!"
              break
            fi
            sleep 1
          done
          
          if [ -z "$SERVER_PORT" ]; then
            echo "❌ Server failed to start!"
            cat /tmp/preview-server.log
            exit 1
          fi
          
          # Export port for Lighthouse config
          echo "SERVER_PORT=$SERVER_PORT" >> $GITHUB_ENV
          
          # Give extra time for full initialization
          echo "Waiting additional 10 seconds for full initialization..."
          sleep 10

      - name: Run Lighthouse CI
        run: |
          # Get the server port from previous step
          SERVER_PORT="${SERVER_PORT:-4173}"
          echo "Using server port: $SERVER_PORT"
          
          # Create temporary config with correct port and relaxed thresholds
          cat > ./.github/lighthouserc.tmp.json << 'EOF'
          {
            "ci": {
              "collect": {
                "numberOfRuns": 1,
                "url": ["http://localhost:4173/", "http://localhost:4174/"],
                "settings": {
                  "chromeFlags": "--no-sandbox --disable-dev-shm-usage",
                  "onlyCategories": ["performance", "accessibility", "best-practices", "seo"],
                  "throttlingMethod": "devtools",
                  "maxWaitForLoad": 90000
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.30}],
                  "categories:accessibility": ["warn", {"minScore": 0.80}],
                  "categories:best-practices": ["warn", {"minScore": 0.80}],
                  "categories:seo": ["warn", {"minScore": 0.70}]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF
          
          # Run Lighthouse CI (non-blocking - warnings only, won't fail build)
          npx @lhci/cli autorun --config ./.github/lighthouserc.tmp.json || echo "⚠️ Lighthouse CI completed with warnings (non-blocking)"
