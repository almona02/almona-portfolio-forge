name: Deploy EU Production

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'k8s/eu-production/**'
      - '.github/workflows/deploy-eu-production.yml'
  workflow_dispatch:
    inputs:
      deploy_region:
        description: 'Deployment Region'
        required: true
        default: 'eu-west-1' 
        type: choice
        options:
        - eu-west-1
        - eu-central-1

env:
  NODE_ENV: production
  REGION: eu-west-1
  GDPR_COMPLIANCE: enabled

jobs:
  security-scan:
    name: Security & Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: GDPR Compliance Check
        run: |
          echo "🔍 Checking GDPR compliance requirements..."
          
          # Check for required GDPR components
          if [ ! -f "src/components/compliance/GDPRCompliance.tsx" ]; then
            echo "❌ GDPR Compliance component missing"
            exit 1
          fi
          
          # Check for EU language support
          if [ ! -d "locales/fr" ] || [ ! -d "locales/de" ]; then
            echo "❌ EU language files missing"
            exit 1
          fi
          
          # Check for GDPR configuration
          if [ ! -f "k8s/eu-production/configmap.yaml" ]; then
            echo "❌ GDPR configuration missing"
            exit 1
          fi
          
          echo "✅ GDPR compliance check passed"
      
      - name: Security Headers Validation
        run: |
          echo "🔒 Validating security headers configuration..."
          
          # Check ingress configuration for security headers
          if grep -q "X-Frame-Options" k8s/eu-production/ingress.yaml; then
            echo "✅ Security headers configured"
          else
            echo "❌ Security headers missing"
            exit 1
          fi

  build-eu-image:
    name: Build EU-Optimized Image
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build EU Production Image
        run: |
          echo "🏗️ Building EU-optimized production image..."
          
          # Build with EU-specific optimizations
          docker build \
            --build-arg NODE_ENV=production \
            --build-arg REGION=eu-west-1 \
            --build-arg GDPR_COMPLIANCE=enabled \
            --build-arg SUPPORTED_LANGUAGES=en,fr,de,ar,tr \
            -t almona-industrial-api:eu-production \
            -f python_backend/Dockerfile.prod \
            python_backend
            
          echo "✅ EU production image built successfully"

  deploy-to-eu:
    name: Deploy to EU Production
    runs-on: ubuntu-latest
    needs: build-eu-image
    environment: eu-production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl for EU cluster
        run: |
          echo "⚙️ Configuring kubectl for EU Kubernetes cluster..."
          # In real deployment, this would configure actual EU cluster access
          echo "kubectl configured for eu-west-1"
      
      - name: Deploy EU Configuration
        run: |
          echo "🚀 Deploying to EU production cluster..."
          
          # Apply EU-specific configurations
