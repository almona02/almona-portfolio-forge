version: "3.8"

services:
  ydt-api:
    build:
      context: ..
      dockerfile: python_backend/Dockerfile
    container_name: ydt-prestige-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      # Add your environment variables here
      # - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      # - DATABASE_URL=${DATABASE_URL}
    volumes:
      # Mount knowledge base if needed
      - ../ai_agents/ydt_agent/knowledge:/app/knowledge:ro
      # Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ydt-network

  # Optional: Add Redis for session management
  # redis:
  #   image: redis:7-alpine
  #   container_name: ydt-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped
  #   networks:
  #     - ydt-network

networks:
  ydt-network:
    driver: bridge

