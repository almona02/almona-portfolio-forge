version: "3.8"

services:
  backend:
    image: almona/backend:pilot
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    image: almona/backend:pilot
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    command: celery -A core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
      --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  smoke:
    image: curlimages/curl:8.10.1
    entrypoint: ["curl"]
    command:
      - "-fsSL"
      - "--retry"
      - "12"
      - "--retry-all-errors"
      - "--retry-delay"
      - "5"
      - "-H"
      - "Host: localhost"
      - "http://backend:8000/api/v2/health"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - smoke

volumes:
  redis_data:


