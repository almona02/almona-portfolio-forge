version: '3.8'

services:
  ydt-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ydt-prestige-api-prod
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - API_WORKERS=4
      - API_RELOAD=false
    env_file:
      - .env.production
    volumes:
      - ../ai_agents/ydt_agent/knowledge:/app/knowledge:ro
      - ./logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ydt-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  ydt-network:
    driver: bridge

